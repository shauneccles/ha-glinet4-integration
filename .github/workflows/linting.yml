name: Linting

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps

      - name: Run prek on all files
        run: uv run prek run --all-files --show-diff-on-failure --color=always

      - name: Run python-typing-update
        run: uv run prek run --stage manual python-typing-update --all-files --show-diff-on-failure --color=always
